name: TikTok DM Bot Automated Run

on:
  schedule:
    # Uruchamia raz dziennie o 15:00 UTC (17:00 czasu polskiego)
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.18.1

      - name: Run TikTok Script
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          TARGET_USERNAMES: ${{ secrets.TARGET_USERNAMES }}
        run: python tiktokdm.py

      - name: Send Discord Webhook Notification
        if: always()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: TikTok Automation Bot
          content: |
            **TikTok Bot Execution Summary**
            Status: `${{ job.status }}`
            Repository: `${{ github.repository }}`
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
